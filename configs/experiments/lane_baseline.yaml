task: lane
seed: 42
device: auto
output_dir: outputs/experiments/lane_baseline

data:
  dataset_config: configs/data/bdd100k.yaml
  source_split: train
  manifest: data/splits/bdd100k_train_dev.json
  train_key: train
  val_key: dev
  image_size: [384, 640]
  batch_size: 4
  num_workers: 0
  horizontal_flip_probability: 0.5
  max_train_samples: null
  max_val_samples: null

model:
  name: resnet18_fpn_segmenter
  pretrained_backbone: true
  fpn_channels: 128

optimization:
  epochs: 30
  optimizer: adamw
  learning_rate: 0.0003
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  amp: false

loss:
  positive_weight: 10.0
  binary_cross_entropy_weight: 1.0
  dice_weight: 1.0

evaluation:
  threshold: 0.5
  tolerance: 2
