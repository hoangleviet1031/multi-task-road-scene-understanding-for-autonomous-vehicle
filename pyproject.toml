[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "roadsense"
version = "0.1.0"
description = "Reproducible baselines for multi-task road-scene understanding"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "ijson>=3.2,<4",
  "numpy>=1.24,<3",
  "Pillow>=10,<13",
  "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
]
train = [
  "torch>=2.4,<3",
  "torchvision>=0.19,<1",
]

[project.scripts]
roadsense = "roadsense.cli:main"
roadsense-train = "roadsense.training.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
